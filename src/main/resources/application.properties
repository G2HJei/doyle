spring.application.name=doyle
spring.task.scheduling.pool.size=2
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=doyle
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=xyz.zlatanov.doyle.core.domain.message
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.concurrency=3
doyle.kafka.topic-partitions=3
doyle.kafka.topic-replicas=1
doyle.kafka.send-timeout=5s
doyle.kafka.retry.max-retries=3
doyle.kafka.retry.initial-backoff=1s
doyle.kafka.retry.backoff-multiplier=2
doyle.rocketmq.name-server=localhost:9876
doyle.rocketmq.max-reconsume-times=3
doyle.outcome-relay.fixed-delay=1s
doyle.outcome-relay.chunk-size=1000
doyle.bet-matching.fixed-delay=1s
doyle.bet-matching.max-run-time=1s
doyle.bet-matching.chunk-size=1000
